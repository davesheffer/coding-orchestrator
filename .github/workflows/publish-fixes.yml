name: Publish verified orchestrator fixes

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply, verify, and publish
        shell: bash
        env:
          PATCH_B64: >-
            
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode | gzip --decompress > "$RUNNER_TEMP/orchestrator-fixes.patch"
          git apply --binary "$RUNNER_TEMP/orchestrator-fixes.patch"
          rm .github/workflows/publish-fixes.yml
          python3 -m compileall -q claude codex relay tests bin/pr-status
          bash -n install.sh codex/install.sh
          python3 -m unittest discover -s tests -q
          git diff --check
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix release upgrades, relay paths, and hook ownership'
          git push origin HEAD:main
