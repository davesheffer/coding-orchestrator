name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m compileall -q claude codex relay tests bin/pr-status bin/agent-run.py bin/rollover-open.py
      - name: Check shell syntax
        if: runner.os != 'Windows'
        run: bash -n install.sh codex/install.sh
      - name: Test installers, executable entry points, release upgrades, and relay
        run: python -m unittest discover -s tests -v
      - name: Test VS Code handoff bridge
        run: node vscode/handoff-bridge/test.js
